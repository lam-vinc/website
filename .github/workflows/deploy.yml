# Builds the site to static files and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Bun installs packages; Nuxt itself runs on Node (^22.19, ^24.11 or >=26).
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@v6

      - run: bun install --frozen-lockfile

      # base_path is "/<repo>" for a project site and "" for a custom domain,
      # so the base URL is right either way without hardcoding the repo name.
      - run: bunx nuxt build --preset github_pages
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
